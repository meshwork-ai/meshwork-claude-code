name: CI

on:
  push:
    branches: [main]
  pull_request:

# 최소 권한 — 필요한 작업만 따로 넓힌다(아키텍처 §18.2)
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 공용 패키지(@meshwork-ai, GitHub Packages)를 받는다
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@meshwork-ai'
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # 저장소 설정(편집기 · npm · 공급망 · Actions 고정)이 기준과 같은지 — @meshwork-ai/config
      - run: pnpm exec meshwork-config check
      - run: pnpm format
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      # 번들(dist/server.mjs)은 커밋해 배포한다 — 소스와 다르면 실패(아키텍처 §19.3)
      - run: git diff --exit-code -- plugin/dist
      - run: pnpm test
