packages:
  - plugin

# 공급망(아키텍처 §18.2) — 새로 나온 버전은 3일 기다린 뒤 받고, 설치 스크립트는 허용한 것만 돈다
minimumReleaseAge: 4320
# 우리 CI 가 검사해 올린 공용 패키지(@meshwork-ai)는 기다리지 않는다 — 대기는 남이 올린 패키지가 오염됐을 때를 막는 것
minimumReleaseAgeExclude:
  - '@meshwork-ai/*'
allowBuilds:
  esbuild: true
overrides:
  # 압축된 요청 뒤 남는 바이트로 서비스 거부 — MCP SDK 의 express 가 가져옴(앱 저장소와 같게)
  body-parser@>=2.0.0 <2.4.0: 2.4.0
